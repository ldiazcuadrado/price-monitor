[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-monitor"
dynamic = ["version"]
description = "Config-driven price and stock monitor: scrape, store history, detect changes, alert, report."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The price-monitor authors" }]
keywords = ["scraping", "price-monitoring", "excel", "alerts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.urls]
Homepage = "https://github.com/ldiazcuadrado/price-monitor"
Repository = "https://github.com/ldiazcuadrado/price-monitor"
Issues = "https://github.com/ldiazcuadrado/price-monitor/issues"

[project.scripts]
price-monitor = "price_monitor.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "types-openpyxl>=3.1",
    "types-pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/price_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/price_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=price_monitor --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["price_monitor"]
# browser.py needs a real Chromium; its missing-dependency path is tested.
omit = ["src/price_monitor/__main__.py", "src/price_monitor/fetch/browser.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "SIM", "RUF", "S", "PERF", "TID"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["price_monitor"]
